# Production stack for the server. Watchtower pulls new :latest images that
# CI pushes to GHCR and restarts the app. See docs/deployment.md (not in git)
# or README.md for the setup steps.
#
# Replace OWNER with the GitHub user/organisation (lowercase). To roll back,
# replace :latest with a git SHA tag, e.g. :3f2c1e0…, and run
# `docker compose -f compose.prod.yaml up -d`.
services:
  harmonytrainer:
    image: ghcr.io/OWNER/harmonytrainer:latest
    restart: unless-stopped
    ports:
      # Only the local reverse proxy should reach the app.
      - "127.0.0.1:${HOST_PORT:-3000}:3000"
    environment:
      FEEDBACK_TOKEN: ${FEEDBACK_TOKEN:?set FEEDBACK_TOKEN in .env}
    volumes:
      - harmony-data:/data
    labels:
      com.centurylinklabs.watchtower.enable: "true"
      com.centurylinklabs.watchtower.scope: harmonytrainer

  watchtower:
    # Maintained fork of containrrr/watchtower (archived in 2025).
    image: nickfedor/watchtower:latest
    restart: unless-stopped
    environment:
      # Only containers labelled for this scope are watched: the app above.
      WATCHTOWER_LABEL_ENABLE: "true"
      WATCHTOWER_SCOPE: harmonytrainer
      WATCHTOWER_POLL_INTERVAL: ${WATCHTOWER_POLL_INTERVAL:-300}
      WATCHTOWER_CLEANUP: "true"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      # Needed only if the GHCR package is private (after `docker login ghcr.io`):
      # - ${HOME}/.docker/config.json:/config.json:ro
    labels:
      com.centurylinklabs.watchtower.scope: harmonytrainer

volumes:
  harmony-data:
